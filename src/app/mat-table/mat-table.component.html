<div>
  <h1>NgFor Table Example</h1>
  <table class="table">
    <thead class="header-row">
      <tr>
        <th>Customer Name</th>
        <th>Email</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody>
      <tr class="row" *ngFor="let item of data">
        <td>{{ item.name.first }}</td>
        <td>{{ item.email }}</td>
        <td>
          {{ item.location.city }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
